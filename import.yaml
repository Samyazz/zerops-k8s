#zeropsPreprocessor=on
project:
  name: zerops-k8s
  corePackage: SERIOUS
  tags:
    - zerops-recipe
    - kubernetes
    - github-samyazz-zerops-k8s
  envVariables:
    K8S_MANAGED: "true"
    K8S_REPOSITORY: Samyazz/zerops-k8s
    K8S_VERSION: v1.36.2
    K8S_NODE_IMAGE: zerops-k8s-node:v1.36.2
    K8S_IMAGE_OBJECT: node-images/zerops-k8s-node-v1.36.2.tar.gz
    K8S_IMAGE_SHA256_OBJECT: node-images/zerops-k8s-node-v1.36.2.tar.gz.sha256
    K8S_CONTROL_PLANE_ENDPOINT: k8sedge.zerops:6443
    K8S_POD_CIDR: 10.244.0.0/16
    K8S_SERVICE_CIDR: 10.96.0.0/16

services:
  - hostname: k8scp1
    type: docker@26.1.5
    startWithoutCode: true
    envSecrets:
      K8S_AGENT_TOKEN: <@generateRandomString(<64>)>
      # kubeadm requires exactly [a-z0-9]{6}.[a-z0-9]{16}. Integer
      # generators avoid punctuation emitted by the generic string generator.
      K8S_BOOTSTRAP_TOKEN: <@generateRandomInt(<100000>,<999999>)>.<@generateRandomInt(<10000000>,<99999999>)><@generateRandomInt(<10000000>,<99999999>)>
      K8S_CERTIFICATE_KEY: <@generateRandomBytes(<32>)|toHex>
      K8S_ENCRYPTION_KEY: <@generateRandomBytes(<32>)|toHex>
    verticalAutoscaling:
      cpuMode: DEDICATED
      minCpu: 4
      maxCpu: 4
      startCpuCoreCount: 4
      minRam: 8
      maxRam: 8
      minDisk: 20
      maxDisk: 20
      swapEnabled: false

  - hostname: k8scp2
    type: docker@26.1.5
    startWithoutCode: true
    verticalAutoscaling: &controlPlaneResources
      cpuMode: DEDICATED
      minCpu: 4
      maxCpu: 4
      startCpuCoreCount: 4
      minRam: 8
      maxRam: 8
      minDisk: 20
      maxDisk: 20
      swapEnabled: false

  - hostname: k8scp3
    type: docker@26.1.5
    startWithoutCode: true
    verticalAutoscaling: *controlPlaneResources

  - hostname: k8sworker1
    type: docker@26.1.5
    startWithoutCode: true
    verticalAutoscaling: &workerResources
      cpuMode: DEDICATED
      minCpu: 4
      maxCpu: 4
      startCpuCoreCount: 4
      minRam: 12
      maxRam: 12
      minDisk: 50
      maxDisk: 50
      swapEnabled: false

  - hostname: k8sworker2
    type: docker@26.1.5
    startWithoutCode: true
    verticalAutoscaling: *workerResources

  - hostname: k8sworker3
    type: docker@26.1.5
    startWithoutCode: true
    verticalAutoscaling: *workerResources

  - hostname: k8sedge
    type: go@1.22
    startWithoutCode: true
    minContainers: 2
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      startCpuCoreCount: 1
      minRam: 0.5
      maxRam: 1
      minDisk: 1
      maxDisk: 2
      swapEnabled: false

  - hostname: k8sbackups
    type: object-storage
    priority: 10
    objectStorageSize: 5
    objectStoragePolicy: private

  # Zerops' first-class observability services. The workflow also calls the
  # first-class recipe API so forwarding and credentials are configured by
  # Zerops when importing into an existing project.
  - hostname: grafanadb
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: prometheusbackups
    type: object-storage
    priority: 10
    objectStorageSize: 5
    objectStoragePolicy: private

  - hostname: grafana
    type: alpine@3.21
    startWithoutCode: true
    enableSubdomainAccess: true
    envSecrets:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: <@generateRandomString(<32>)>
      GF_SECURITY_SECRET_KEY: <@generateRandomString(<32>)>

  - hostname: prometheus
    type: alpine@3.21
    startWithoutCode: true
    enableSubdomainAccess: true
    maxContainers: 1

  - hostname: elkstorage
    type: elasticsearch:single@8.16
    priority: 10

  - hostname: kibana
    type: ubuntu@24.04
    buildFromGit: https://github.com/zeropsio/recipe-elk@main
    zeropsSetup: kibana
    enableSubdomainAccess: true
    maxContainers: 1
    verticalAutoscaling:
      minRam: 1
      maxRam: 4

  - hostname: logstash
    type: ubuntu@24.04
    buildFromGit: https://github.com/zeropsio/recipe-elk@main
    zeropsSetup: logstash
    maxContainers: 1
    verticalAutoscaling:
      minRam: 1
      maxRam: 4

  - hostname: apmserver
    type: ubuntu@24.04
    buildFromGit: https://github.com/zeropsio/recipe-elk@main
    zeropsSetup: apmserver
    maxContainers: 1
    envSecrets:
      SECRET_TOKEN: <@generateRandomString(<32>)>
