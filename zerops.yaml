  - setup: edge
    build:
      base: go@1.22
      deployFiles:
        - ./edge
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 18082
          path: /healthz
    run:
      base: go@1.22
      prepareCommands:
        - &installHAProxy |
          set -eu
          if command -v apk >/dev/null 2>&1; then
            sudo apk add --no-cache 'haproxy~3.2'
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends haproxy
          else
            printf 'unsupported edge base: neither apk nor apt-get is available\n' >&2
            exit 1
          fi
      ports:
        - port: 8080
          httpSupport: true
          protocol: tcp
        - port: 6443
          httpSupport: false
          protocol: tcp
        - port: 18081
          httpSupport: false
          protocol: tcp
        - port: 18082
          httpSupport: false
          protocol: tcp
      envVariables:
        K8S_DSR_HOSTNAME: _dsr.k8sedge.zerops
        K8S_EDGE_API_BACKENDS: k8scp1:6443,k8scp2:6443,k8scp3:6443
        K8S_EDGE_INGRESS_BACKENDS: k8sworker1:32080,k8sworker2:32080,k8sworker3:32080
        K8S_EDGE_HEADLAMP_BACKENDS: k8sworker1:32081,k8sworker2:32081,k8sworker3:32081
      healthCheck:
        httpGet:
          port: 18082
          path: /healthz
      start: ./edge/run-haproxy.sh

  # Compact-production nodes retain the S3-backed image cache and recovery
  # storage, but deliberately carry no references to the full observability
  # services. The aliases keep the build/runtime mechanism identical on all
  # three nodes while each setup supplies its own role and identity.
  - setup: controlplane1-production
    build: &productionNodeBuild
      base: go@1.22
      buildCommands:
        - mkdir -p dist
        - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/zerops-k8s ./cmd/zerops-k8s
        - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o s3-fetch ./cmd/s3-fetch
      deployFiles:
        - .
    deploy: &productionNodeDeploy
      temporaryShutdown: true
      readinessCheck:
        httpGet:
          port: 18080
          path: /healthz
    run:
      base: docker@26.1.5
      ports: &productionNodePorts
        - port: 18080
          httpSupport: false
          protocol: tcp
      initCommands: &productionNodeInit
        - |
          set -eu
          if ! docker image inspect "$K8S_NODE_IMAGE" >/dev/null 2>&1; then
            ./s3-fetch -endpoint "$K8S_IMAGE_STORAGE_ENDPOINT" -bucket "$K8S_IMAGE_STORAGE_BUCKET" -object "$K8S_IMAGE_OBJECT" -output /home/zerops/node-image.tar.gz -access-key "$AWS_ACCESS_KEY_ID" -secret-key "$AWS_SECRET_ACCESS_KEY"
            ./s3-fetch -endpoint "$K8S_IMAGE_STORAGE_ENDPOINT" -bucket "$K8S_IMAGE_STORAGE_BUCKET" -object "$K8S_IMAGE_SHA256_OBJECT" -output /home/zerops/node-image.tar.gz.sha256 -access-key "$AWS_ACCESS_KEY_ID" -secret-key "$AWS_SECRET_ACCESS_KEY"
            sed -i 's#  .*#  node-image.tar.gz#' /home/zerops/node-image.tar.gz.sha256
            (cd /home/zerops && sha256sum -c node-image.tar.gz.sha256)
            docker image load -i /home/zerops/node-image.tar.gz
            rm -f /home/zerops/node-image.tar.gz /home/zerops/node-image.tar.gz.sha256
          fi
        - sudo mkdir -p /var/lib/zerops-k8s
        - sudo chown -R zerops:zerops /var/lib/zerops-k8s
        - sudo mount --make-rshared /
      envVariables:
        K8S_MODE: node
        K8S_NODE_ROLE: control-plane
        K8S_NODE_NAME: k8scp1
        AWS_ACCESS_KEY_ID: ${k8sbackups_accessKeyId}
        AWS_SECRET_ACCESS_KEY: ${k8sbackups_secretAccessKey}
        AWS_DEFAULT_REGION: us-east-1
        K8S_IMAGE_STORAGE_ENDPOINT: ${k8sbackups_apiUrl}
        K8S_IMAGE_STORAGE_BUCKET: ${k8sbackups_bucketName}
      healthCheck: &productionNodeHealth
        httpGet:
          port: 18080
          path: /healthz
      start: ./dist/zerops-k8s

  - setup: worker1-production
    build: *productionNodeBuild
    deploy: *productionNodeDeploy
    run:
      base: docker@26.1.5
      ports: *productionNodePorts
      initCommands: *productionNodeInit
      envVariables:
