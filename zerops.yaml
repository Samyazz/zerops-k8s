      initCommands: *productionNodeInit
      envVariables:
        K8S_MODE: node
        K8S_NODE_ROLE: worker
        K8S_NODE_NAME: k8sworker3
        AWS_ACCESS_KEY_ID: ${k8sbackups_accessKeyId}
        AWS_SECRET_ACCESS_KEY: ${k8sbackups_secretAccessKey}
        AWS_DEFAULT_REGION: us-east-1
        K8S_IMAGE_STORAGE_ENDPOINT: ${k8sbackups_apiUrl}
        K8S_IMAGE_STORAGE_BUCKET: ${k8sbackups_bucketName}
      healthCheck: *productionNodeHealth
      start: ./dist/zerops-k8s

  - setup: edge-production
    build:
      base: go@1.22
      deployFiles:
        - ./edge
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 18082
          path: /healthz
    run:
      base: go@1.22
      prepareCommands:
        - *installHAProxy
      ports:
        - port: 8080
          httpSupport: true
          protocol: tcp
        - port: 6443
          httpSupport: false
          protocol: tcp
        - port: 18082
          httpSupport: false
          protocol: tcp
      envVariables:
        K8S_DSR_HOSTNAME: _dsr.k8sedge.zerops
        K8S_EDGE_API_BACKENDS: k8scp1:6443
        K8S_EDGE_INGRESS_BACKENDS: k8sworker1:32080,k8sworker2:32080
        K8S_EDGE_HEADLAMP_ENABLED: "false"
      healthCheck:
        httpGet:
          port: 18082
          path: /healthz
      start: ./edge/run-haproxy.sh

  # Staging builds the pinned Docker image independently in each runtime. It
  # verifies both the resulting immutable image ID and kubeadm version before
  # starting the node agent; no S3 variables or services are referenced.
  - setup: controlplane1-staging
    build: &stagingNodeBuild
      base: go@1.22
      buildCommands:
        - mkdir -p dist
        - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/zerops-k8s ./cmd/zerops-k8s
      deployFiles:
        - .
    deploy: &stagingNodeDeploy
      temporaryShutdown: true
      readinessCheck:
        httpGet:
          port: 18080
          path: /healthz
    run:
      base: docker@26.1.5
      ports: &stagingControlPlanePorts
        - port: 18080
          httpSupport: false
          protocol: tcp
        - port: 6443
          httpSupport: false
          protocol: tcp
      initCommands: &stagingNodeInit
        - |
          set -eu
          # versions.env and the Dockerfile are part of the deployed source.
          # shellcheck disable=SC1091
          . ./versions.env
          test "v${KUBERNETES_VERSION}" = "$K8S_VERSION"
          if ! docker image inspect "$K8S_NODE_IMAGE" >/dev/null 2>&1; then
            docker build --pull \
              --build-arg "KUBERNETES_VERSION=${KUBERNETES_VERSION}" \
              --build-arg "KUBERNETES_MINOR=${KUBERNETES_VERSION%.*}" \
              --build-arg "KUBERNETES_PACKAGE_VERSION=${KUBERNETES_PACKAGE_VERSION}" \
              --build-arg "CRI_TOOLS_PACKAGE_VERSION=${CRI_TOOLS_PACKAGE_VERSION}" \
              --tag "$K8S_NODE_IMAGE" \
              --file node/Dockerfile .
          fi
          image_id=$(docker image inspect --format '{{.Id}}' "$K8S_NODE_IMAGE")
          test -n "$image_id"
          image_version=$(docker run --rm --entrypoint kubeadm "$K8S_NODE_IMAGE" version -o short)
          test "$image_version" = "$K8S_VERSION"
          sudo mkdir -p /var/lib/zerops-k8s
          printf '%s\n' "$image_id" | sudo tee /var/lib/zerops-k8s/node-image-id >/dev/null
        - sudo chown -R zerops:zerops /var/lib/zerops-k8s
        - sudo mount --make-rshared /
      envVariables:
        K8S_MODE: node
        K8S_NODE_ROLE: control-plane
        K8S_NODE_NAME: k8scp1
      healthCheck: &stagingNodeHealth
        httpGet:
          port: 18080
          path: /healthz
      start: ./dist/zerops-k8s

  - setup: worker1-staging
    build: *stagingNodeBuild
    deploy: *stagingNodeDeploy
    run:
      base: docker@26.1.5
      ports:
        - port: 18080
          httpSupport: false
          protocol: tcp
        - port: 32080
          httpSupport: true
          protocol: tcp
      initCommands: *stagingNodeInit
      envVariables:
        K8S_MODE: node
        K8S_NODE_ROLE: worker
        K8S_NODE_NAME: k8sworker1
      healthCheck: *stagingNodeHealth
      start: ./dist/zerops-k8s

  - setup: edge-staging
    build:
      base: go@1.22
      deployFiles:
        - ./edge
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 18082
          path: /healthz
    run:
      base: go@1.22
      prepareCommands:
        - *installHAProxy
      ports:
        - port: 8080
          httpSupport: true
          protocol: tcp
        - port: 6443
          httpSupport: false
          protocol: tcp
        - port: 18082
          httpSupport: false
          protocol: tcp
      envVariables:
        K8S_DSR_HOSTNAME: _dsr.k8sedge.zerops
        K8S_EDGE_API_BACKENDS: k8scp1:6443
        K8S_EDGE_INGRESS_BACKENDS: k8sworker1:32080
        K8S_EDGE_HEADLAMP_ENABLED: "false"
      healthCheck:
        httpGet:
          port: 18082
          path: /healthz
      start: ./edge/run-haproxy.sh

  # These two setups customize Zerops' first-class Prometheus/Grafana recipe.
  # They stay outside Kubernetes; the cluster only ships telemetry to them.
  - setup: prometheus
    build:
      base: alpine@3.21
      deployFiles:
        - ./observability/prometheus/~
    deploy:
      temporaryShutdown: true
      readinessCheck:
        httpGet:
          port: 9090
          path: /-/ready
    run:
      base: alpine@3.21
      ports:
        - port: 9090
          httpSupport: true
          protocol: tcp
      prepareCommands:
        - curl -fsSLo /home/zerops/prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.13.1/prometheus-3.13.1.linux-amd64.tar.gz
        - tar -xzf /home/zerops/prometheus.tar.gz -C /home/zerops --strip-components=1 prometheus-3.13.1.linux-amd64/prometheus prometheus-3.13.1.linux-amd64/promtool
      initCommands:
        - cp /home/zerops/prometheus /home/zerops/promtool /var/www/
        - mkdir -p /var/www/data
        - zsc object-storage restore --storage data_backups --name "${ZEROPS_StackName}-data" --ignore-non-existing /var/www/data
      envVariables:
        RETENTION_TIME: 4h
        BACKUP_COUNT: "4"
        data_backups_apiUrl: ${prometheusbackups_apiUrl}
        data_backups_accessKeyId: ${prometheusbackups_accessKeyId}
        data_backups_secretAccessKey: ${prometheusbackups_secretAccessKey}
        data_backups_bucketName: ${prometheusbackups_bucketName}
      crontab:
        - timing: "0 * * * *"
          command: curl -fsS -X POST http://localhost:9090/api/v1/admin/tsdb/snapshot && snapshot=$(ls -t /var/www/data/snapshots/ | head -n1) && cd "/var/www/data/snapshots/$snapshot" && zsc object-storage backup --storage data_backups --name "${ZEROPS_StackName}-data" --truncate-count "${BACKUP_COUNT:-4}" ./ && rm -rf "/var/www/data/snapshots/$snapshot"
          allContainers: false
      healthCheck:
        httpGet:
          port: 9090
          path: /-/healthy
      start: ./run-prometheus.sh

  - setup: grafana
    build:
      base: alpine@3.21
      deployFiles:
        - ./observability/grafana/~
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /api/health
    run:
      base: alpine@3.21
      ports:
        - port: 3000
          httpSupport: true
          protocol: tcp
      prepareCommands:
        - curl -fsSLo /home/zerops/grafana.tar.gz https://dl.grafana.com/oss/release/grafana-13.1.0.linux-amd64.tar.gz
        - tar -xzf /home/zerops/grafana.tar.gz -C /home/zerops --strip-components=1
      initCommands:
        - cp -a /home/zerops/. /var/www/
      envVariables:
        GF_DATABASE_URL: postgres://${grafanadb_user}:${grafanadb_password}@${grafanadb_hostname}:${grafanadb_port}/${grafanadb_dbName}
        GF_DATABASE_HIGH_AVAILABILITY: "true"
        GF_LOG_MODE: syslog
        GF_AUTH_ANONYMOUS_ENABLED: "false"
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health
      start: ./run-grafana.sh
