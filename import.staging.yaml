#zeropsPreprocessor=on
# Minimal disposable staging: one control plane and one worker only. Each
# runtime builds the pinned node image locally, so no edge, S3, or other
# recipe-owned service is required.
project:
  name: zerops-k8s-staging
  corePackage: LIGHT
  tags:
    - zerops-recipe
    - kubernetes
    - github-samyazz-zerops-k8s
    - zerops-k8s-profile-staging
  envVariables:
    K8S_MANAGED: "true"
    K8S_PROFILE: staging
    K8S_REPOSITORY: Samyazz/zerops-k8s
    K8S_VERSION: v1.36.2
    K8S_NODE_IMAGE: zerops-k8s-node:v1.36.2
    K8S_CONTROL_PLANE_ENDPOINT: k8scp1.zerops:6443
    K8S_POD_CIDR: 10.244.0.0/16
    K8S_SERVICE_CIDR: 10.96.0.0/16

services:
  # Single control plane; API maintenance causes an expected staging outage.
  # Secret material is generated by Zerops and never appears in source.
  - hostname: k8scp1
    type: docker@26.1.5
    startWithoutCode: true
    minContainers: 1
    maxContainers: 1
    envSecrets:
      K8S_AGENT_TOKEN: <@generateRandomString(<64>)>
      K8S_BOOTSTRAP_TOKEN: <@generateRandomInt(<100000>,<999999>)>.<@generateRandomInt(<10000000>,<99999999>)><@generateRandomInt(<10000000>,<99999999>)>
      K8S_CERTIFICATE_KEY: <@generateRandomBytes(<32>)|toHex>
      K8S_ENCRYPTION_KEY: <@generateRandomBytes(<32>)|toHex>
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 2
      maxCpu: 2
      startCpuCoreCount: 2
      minRam: 4
      maxRam: 4
      minDisk: 20
      maxDisk: 20
      swapEnabled: false

  # One fixed worker hosts Traefik and the staging workload. The profile has no
  # horizontal resize, durable storage, backups, or dedicated observability.
  - hostname: k8sworker1
    type: docker@26.1.5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 2
      maxCpu: 2
      startCpuCoreCount: 2
      minRam: 4
      maxRam: 4
      minDisk: 20
      maxDisk: 20
      swapEnabled: false
