name: Reusable Zerops Kubernetes deployment

on:
  workflow_call:
    inputs:
      profile:
        description: Cluster profile to reconcile
        required: false
        default: full
        type: string
      run_full_conformance:
        description: Run the full CNCF certified-conformance suite
        required: false
        default: true
        type: boolean
    secrets:
      ZEROPS_TOKEN:
        required: true
      K8S_RECOVERY_AGE_IDENTITY:
        required: true

permissions:
  contents: read

concurrency:
  group: zerops-k8s-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == github.repository_owner || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_CLIENT_ID: ${{ vars.ZEROPS_CLIENT_ID }}
      K8S_PROFILE: ${{ inputs.profile }}
      RUN_FULL_CONFORMANCE: ${{ inputs.run_full_conformance }}
      K8S_RECOVERY_AGE_RECIPIENT: ${{ vars.K8S_RECOVERY_AGE_RECIPIENT }}
      K8S_RECOVERY_AGE_IDENTITY: ${{ secrets.K8S_RECOVERY_AGE_IDENTITY }}
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Enforce repository-owner trigger
        shell: bash
        run: |
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || {
            echo 'Only the repository owner may deploy.' >&2
            exit 1
          }

      - name: Validate selected profile before mutation
        shell: bash
        run: |
          source ./scripts/lib.sh
          [[ "$K8S_PROFILE" != full || "$RUN_FULL_CONFORMANCE" == true ]] \
            || die 'profile full requires the CNCF certified-conformance suite; no changes were made'
          printf 'Selected profile: %s\n' "$K8S_PROFILE"

      - name: Install pinned deployment tools
        shell: bash
        run: ./scripts/install-tools.sh

      - name: Authenticate to Zerops
        shell: bash
        run: zcli login "$ZEROPS_TOKEN"

      - name: Provision, deploy, test, and collect evidence
        shell: bash
        run: ./scripts/deploy.sh

      - name: Record sanitized resolved profile contract
        if: always()
        shell: bash
        run: |
          source ./scripts/lib.sh
          mkdir -p "$RUNNER_TEMP/evidence"
          jq --arg profile "$K8S_PROFILE" \
            '{profile: $profile, resolvedContract: .}' "$PROFILE_FILE" \
            >"$RUNNER_TEMP/evidence/profile-contract.json"

      - name: Sanitize acceptance evidence before upload
        if: always()
        shell: bash
        run: |
          # Recovery archives are deliberately never Action artifacts, even when
          # encrypted. Their checksums and object keys remain as text evidence.
          find "$RUNNER_TEMP/evidence" -type f -name '*.age' -delete 2>/dev/null || true
          ./scripts/sanitize-evidence-tree.sh "$RUNNER_TEMP/evidence"

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zerops-k8s-${{ inputs.profile }}-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 1

  cleanup:
    needs: deploy
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      K8S_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install pinned cleanup tools
        shell: bash
        run: ./scripts/install-tools.sh

      - name: Clean infrastructure owned by this failed run
        shell: bash
        run: |
          zcli login "$ZEROPS_TOKEN"
          ./scripts/cleanup-failed-run.sh
