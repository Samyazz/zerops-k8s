name: Deploy Zerops Kubernetes

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Cluster profile to reconcile
        required: true
        default: full
        type: choice
        options:
          - full
          - production
          - staging
      run_full_conformance:
        description: Run full CNCF conformance (mandatory for full; optional for compact profiles)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    if: github.actor == github.repository_owner
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      profile: ${{ inputs.profile }}
      run_full_conformance: ${{ inputs.run_full_conformance }}
    secrets: inherit
