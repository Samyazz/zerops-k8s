name: Upgrade Zerops Kubernetes version

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Live cluster profile to upgrade
        required: true
        default: full
        type: choice
        options:
          - full
          - production
          - staging
      confirm_target:
        description: Exact reviewed target from versions.env, including v (for example v1.36.2)
        required: true
        type: string
      plan_only:
        description: Validate compatibility, backup/restore, image, and kubeadm plan without changing the control plane
        required: true
        default: true
        type: boolean
      run_full_conformance:
        description: Run full CNCF conformance after an applied upgrade
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: zerops-k8s-${{ github.repository }}
  cancel-in-progress: false

jobs:
  controlled-upgrade:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_CLIENT_ID: ${{ vars.ZEROPS_CLIENT_ID }}
      K8S_PROFILE: ${{ inputs.profile }}
      K8S_RECOVERY_AGE_RECIPIENT: ${{ vars.K8S_RECOVERY_AGE_RECIPIENT }}
      K8S_RECOVERY_AGE_IDENTITY: ${{ secrets.K8S_RECOVERY_AGE_IDENTITY }}
      UPGRADE_CONFIRM_TARGET: ${{ inputs.confirm_target }}
      UPGRADE_PLAN_ONLY: ${{ inputs.plan_only }}
      RUN_FULL_CONFORMANCE: ${{ inputs.run_full_conformance }}
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate selected profile before mutation
        shell: bash
        run: |
          source ./scripts/lib.sh
          printf 'Selected profile: %s\n' "$K8S_PROFILE"

      - name: Install pinned tools
        shell: bash
        run: ./scripts/install-tools.sh

      - name: Validate, plan, and optionally apply the reviewed upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          vpn_connected=false
          finish() {
            status=$?
            if [[ "$vpn_connected" == true ]]; then zcli vpn down >/dev/null 2>&1 || true; fi
            exit "$status"
          }
          trap finish EXIT INT TERM
          zcli login "$ZEROPS_TOKEN"
          zcli vpn up -P "$ZEROPS_PROJECT_ID" --auto-disconnect --mtu "${ZEROPS_VPN_MTU:-1280}"
          vpn_connected=true
          source ./scripts/lib.sh
          load_zerops_env
          log 'loaded Zerops project environment; requesting the admin kubeconfig'
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          agent_request k8scp1 GET /v1/cluster/kubeconfig >"$KUBECONFIG"
          log 'received the admin kubeconfig; validating API readiness'
          sed -i "s#^[[:space:]]*server:.*#    server: https://${CONTROL_PLANE_ENDPOINT}#" "$KUBECONFIG"
          chmod 0600 "$KUBECONFIG"
          kubectl get --raw=/readyz >/dev/null
          log 'Kubernetes API is ready; starting the controlled upgrade workflow'
          ./scripts/upgrade-cluster.sh

      - name: Record sanitized resolved profile contract
        if: always()
        shell: bash
        run: |
          source ./scripts/lib.sh
          mkdir -p "$RUNNER_TEMP/evidence"
          jq --arg profile "$K8S_PROFILE" \
            '{profile: $profile, resolvedContract: .}' "$PROFILE_FILE" \
            >"$RUNNER_TEMP/evidence/profile-contract.json"

      - name: Sanitize upgrade evidence before upload
        if: always()
        shell: bash
        run: ./scripts/sanitize-evidence-tree.sh "$RUNNER_TEMP/evidence"

      - name: Upload sanitized upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zerops-k8s-${{ env.K8S_PROFILE }}-upgrade-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 1
