name: Drill Zerops Kubernetes recovery

on:
  schedule:
    - cron: '13 4 1 * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Live cluster profile (staging does not support restore drills)
        required: true
        default: full
        type: choice
        options:
          - full
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: zerops-k8s-${{ github.repository }}
  cancel-in-progress: false

jobs:
  restore-drill:
    if: github.actor == github.repository_owner || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_CLIENT_ID: ${{ vars.ZEROPS_CLIENT_ID }}
      K8S_PROFILE: ${{ inputs.profile || vars.K8S_PROFILE || 'full' }}
      K8S_RECOVERY_AGE_RECIPIENT: ${{ vars.K8S_RECOVERY_AGE_RECIPIENT }}
      K8S_RECOVERY_AGE_IDENTITY: ${{ secrets.K8S_RECOVERY_AGE_IDENTITY }}
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Enforce repository-owner trigger
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || {
            echo 'Only the repository owner may run recovery drills.' >&2
            exit 1
          }

      - name: Validate profile restore capability before mutation
        shell: bash
        run: |
          source ./scripts/lib.sh
          profile_capability restore \
            || die "profile $K8S_PROFILE does not support restore drills; no changes were made"

      - name: Install pinned tools
        shell: bash
        run: ./scripts/install-tools.sh

      - name: Create a fresh recovery point and restore it in isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          vpn_connected=false
          finish() {
            status=$?
            if [[ "$vpn_connected" == true ]]; then zcli vpn down >/dev/null 2>&1 || true; fi
            exit "$status"
          }
          trap finish EXIT INT TERM
          zcli login "$ZEROPS_TOKEN"
          source ./scripts/lib.sh
          live_profile=$(cluster_tag_value profile); live_profile=${live_profile:-full}
          [[ "$live_profile" == "$K8S_PROFILE" ]] \
            || die "selected profile $K8S_PROFILE does not match live profile $live_profile; no changes were made"
          zcli vpn up -P "$ZEROPS_PROJECT_ID" --auto-disconnect --mtu "${ZEROPS_VPN_MTU:-1280}"
          vpn_connected=true
          load_zerops_env
          log 'loaded Zerops project environment; requesting the admin kubeconfig'
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          agent_request k8scp1 GET /v1/cluster/kubeconfig >"$KUBECONFIG"
          log 'received the admin kubeconfig; validating API readiness'
          sed -i "s#^[[:space:]]*server:.*#    server: https://${CONTROL_PLANE_ENDPOINT}#" "$KUBECONFIG"
          chmod 0600 "$KUBECONFIG"
          kubectl get --raw=/readyz >/dev/null
          log 'Kubernetes API is ready; starting the fresh backup and restore drill'
          ./scripts/backup-cluster.sh
          ./scripts/restore-drill.sh

      - name: Record sanitized resolved profile contract
        if: always()
        shell: bash
        run: |
          source ./scripts/lib.sh
          mkdir -p "$RUNNER_TEMP/evidence"
          jq --arg profile "$K8S_PROFILE" \
            '{profile: $profile, resolvedContract: .}' "$PROFILE_FILE" \
            >"$RUNNER_TEMP/evidence/profile-contract.json"

      - name: Sanitize restore evidence before upload
        if: always()
        shell: bash
        run: ./scripts/sanitize-evidence-tree.sh "$RUNNER_TEMP/evidence"

      - name: Upload sanitized restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zerops-k8s-${{ env.K8S_PROFILE }}-restore-drill-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 1
