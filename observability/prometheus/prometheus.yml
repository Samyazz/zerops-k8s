global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: zerops-k8s

rule_files:
  - /var/www/rules/*.yml

scrape_configs:
  - job_name: zerops
    honor_labels: true
    http_sd_configs:
      - url: http://metrics.core.zerops:9601/service-discovery

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: kubernetes-alloy
    static_configs:
      - targets: [k8sworker1:12345, k8sworker2:12345, k8sworker3:12345]
    metrics_path: /metrics
