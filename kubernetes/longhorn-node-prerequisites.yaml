apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-node-prerequisites
  namespace: kube-system
  labels:
    app.kubernetes.io/name: longhorn-node-prerequisites
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-node-prerequisites
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-node-prerequisites
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      tolerations:
        - operator: Exists
      containers:
        - name: module-loader
          image: alpine:3.21
          command:
            - sh
            - -ec
            - |
              apk add --no-cache kmod
              modprobe iscsi_tcp
              test -d /sys/module/iscsi_tcp
              exec sleep 2147483647
          readinessProbe:
            exec:
              command: [test, -d, /sys/module/iscsi_tcp]
            initialDelaySeconds: 1
            periodSeconds: 10
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
