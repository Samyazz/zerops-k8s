replicas: 2

args:
  - --kubelet-insecure-tls

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  node-role.kubernetes.io/worker: ""

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 250m
    memory: 256Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: metrics-server
