image:
  tag: v3.7.6
  digest: sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2

versionOverride: v3.7.6

deployment:
  replicas: 1
  minReadySeconds: 5

podDisruptionBudget:
  enabled: false

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gateway:
  enabled: false

gatewayClass:
  enabled: true
  name: traefik

ingressClass:
  enabled: false

api:
  dashboard: false

service:
  type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 32080
  websecure:
    expose:
      default: false

nodeSelector:
  node-role.kubernetes.io/worker: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
