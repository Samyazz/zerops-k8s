apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-server
  namespace: headlamp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: headlamp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: headlamp}
    spec:
      serviceAccountName: headlamp-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.43.0
          args: [-in-cluster, -base-url, /]
          ports:
            - {name: http, containerPort: 4466}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: headlamp}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: headlamp
  namespace: headlamp
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: headlamp}
