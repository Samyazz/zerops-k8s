apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: zerops-volume-backup
  namespace: longhorn-system
spec:
  cron: "17 */6 * * *"
  task: backup
  groups:
    - default
  retain: 8
  concurrency: 1
  parameters:
    full-backup-interval: "7"
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: zerops-system-backup
  namespace: longhorn-system
spec:
  cron: "47 */6 * * *"
  task: system-backup
  groups: []
  retain: 8
  concurrency: 1
  parameters:
    volume-backup-policy: always
---
apiVersion: v1
kind: Namespace
metadata:
  name: zerops-backup-validation
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-backup-proof
  namespace: zerops-backup-validation
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-backup-proof
  namespace: zerops-backup-validation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-backup-proof
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-backup-proof
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof-writer
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -s /data/proof.txt ]; then
                date -u +%Y-%m-%dT%H:%M:%SZ > /data/proof.txt
                sync
              fi
              exec sleep 2147483647
          readinessProbe:
            exec:
              command: [test, -s, /data/proof.txt]
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-backup-proof
