apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: zerops-volume-backup
  namespace: longhorn-system
spec:
  cron: "17 */6 * * *"
  task: backup
  groups:
    - default
  retain: 8
  concurrency: 1
  parameters:
    full-backup-interval: "7"
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: zerops-system-backup
  namespace: longhorn-system
spec:
  cron: "47 */6 * * *"
  task: system-backup
  groups: []
  retain: 8
  concurrency: 1
  parameters:
    volume-backup-policy: always
---
apiVersion: v1
kind: Namespace
metadata:
  name: zerops-backup-validation
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-backup-proof
  namespace: zerops-backup-validation
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 64Mi
