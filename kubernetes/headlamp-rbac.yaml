apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp-admin, namespace: headlamp}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp-operator, namespace: headlamp}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp-developer, namespace: headlamp}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp-readonly, namespace: headlamp}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: headlamp-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: headlamp-admin, namespace: headlamp}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: headlamp-operator}
rules:
  - apiGroups: ["", apps, batch, autoscaling, networking.k8s.io, policy, gateway.networking.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/healthz", "/readyz", "/livez", "/version"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: headlamp-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: headlamp-operator}
subjects: [{kind: ServiceAccount, name: headlamp-operator, namespace: headlamp}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: headlamp-developer, namespace: workloads}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin}
subjects: [{kind: ServiceAccount, name: headlamp-developer, namespace: headlamp}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: headlamp-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: headlamp-readonly, namespace: headlamp}]
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin-token
  namespace: headlamp
  annotations: {kubernetes.io/service-account.name: headlamp-admin}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-operator-token
  namespace: headlamp
  annotations: {kubernetes.io/service-account.name: headlamp-operator}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-developer-token
  namespace: headlamp
  annotations: {kubernetes.io/service-account.name: headlamp-developer}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-readonly-token
  namespace: headlamp
  annotations: {kubernetes.io/service-account.name: headlamp-readonly}
type: kubernetes.io/service-account-token
